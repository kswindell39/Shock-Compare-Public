<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shock Comparison App</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<script>
/* Passcode screen. The code is not case sensitive; only its SHA-256 hash is stored here. */
(function () {
  var H = '8531cf2a7bbe27bd8918987502eb9d04d5bc8850db390d8ff7eb69542efdca7b', K = 'sc-gate';
  var ok = false; try { ok = localStorage.getItem(K) === H; } catch (e) {}
  if (ok) return;
  var d = document.documentElement; d.classList.add('locked');
  var st = document.createElement('style');
  st.textContent = 'html.locked body>*:not(#gate){display:none!important}' +
    '#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg,#151517)}' +
    '#gate form{width:100%;max-width:320px;text-align:center}#gate h1{font:800 22px system-ui;margin:0 0 6px}' +
    '#gate p{margin:0 0 16px;color:var(--mut,#9a9aa2);font-size:14px}' +
    '#gate input{width:100%;font:17px system-ui;padding:12px;border-radius:12px;border:1px solid var(--line,#33333a);background:var(--card,#1f1f22);color:var(--ink,#ececee);text-align:center}' +
    '#gate button{width:100%;margin-top:10px;font:600 16px system-ui;padding:12px;border-radius:12px;border:0;background:var(--ink,#ececee);color:var(--bg,#151517)}' +
    '#gate .err{color:var(--bad,#e66767);min-height:20px;margin-top:10px;font-size:14px}';
  document.head.appendChild(st);
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function show() {
    var g = document.createElement('div'); g.id = 'gate';
    g.innerHTML = '<form autocomplete="off"><h1>Shock Comparison App</h1><p>Enter the passcode to continue.</p>' +
      '<input type="password" placeholder="Passcode" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<button type="submit">Unlock</button><div class="err"></div></form>';
    document.body.appendChild(g);
    var f = g.querySelector('form'), i = g.querySelector('input'), er = g.querySelector('.err');
    i.focus();
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = i.value.trim().toLowerCase();
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (b) {
        if (hex(b) === H) {
          try { localStorage.setItem(K, H); } catch (e) {}
          d.classList.remove('locked'); g.remove();
          window.dispatchEvent(new Event('resize'));
        } else { er.textContent = 'Wrong passcode. Try again.'; i.select(); }
      });
    });
  }
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
</script>
<meta name="theme-color" content="#151517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shocks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e1dc;--hl:#fbe36a;--flag:#ffe9a8;--flagb:#d9a400;--grid:#e9e7e2;--axis:#8a8984;--bad:#c93a39;--alt:#ecebe5;--csel:#d6e4fa;--cselx:#a9c7f5;--cselh:#2a78d6;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1f1f22;--ink:#ececee;--mut:#9a9aa2;--line:#33333a;--hl:#6b5d12;--flag:#5a4a10;--flagb:#e0b520;--grid:#2c2c31;--axis:#77767d;--bad:#e66767;--alt:#28282c;--csel:#233650;--cselx:#33507a;--cselh:#6aa6f0;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.seg::-webkit-scrollbar{display:none}
nav a{flex:1 0 auto;text-align:center;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg)}
.navbtn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;line-height:1}
main{padding:12px 16px 40px;max-width:1100px;margin:0 auto}
h2{font-size:17px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.btn{font:600 13.5px system-ui;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:10px 2px 5px}
.clab i{text-transform:none;letter-spacing:0;font-weight:500;font-style:normal;opacity:.8;margin-left:4px}
.segc{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.segc button{flex:1 1 0;min-width:0;border:0;background:transparent;font:600 13px system-ui;padding:8px 0;border-radius:8px;white-space:nowrap}
.segc button.on{background:var(--ink);color:var(--bg)}
.stick{position:sticky;top:var(--navh,56px);z-index:4;background:var(--bg);margin:0 -16px 8px;padding:6px 16px 8px;border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.corner{font-weight:800;font-size:18px}.ser{font-weight:600}
.meta{color:var(--mut);font-size:12px;margin-top:2px}
.tw{overflow-x:auto;margin-top:8px}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px;width:100%}
.t th,.t td{padding:2px 5px;text-align:right;white-space:nowrap}
.t td,.t thead th:not(:first-child){text-align:center}
.t thead th{color:var(--mut);font-weight:600;font-size:11px;border-bottom:1px solid var(--line)}
.t tbody th{color:var(--mut);font-weight:600;position:sticky;left:0;background:var(--card)}
.t tr.sec th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);padding-top:8px}
.t tr.alt td,.t tr.alt th{background:var(--alt)}
.t tr.hl td,.t tr.hl th{background:var(--hl)}
.t td.zero{font-weight:700}
.t td{cursor:pointer}
.t td.csel,.t tr.alt td.csel{background:var(--csel)}
.t tr.hl td.csel{background:var(--hl);box-shadow:inset 2px 0 var(--cselh),inset -2px 0 var(--cselh)}
.t tr.rsel td,.t tr.rsel th{background:var(--csel)}
.t tr.rsel th{color:var(--ink)}
.t tr.rsel td.csel{background:var(--cselx);font-weight:700;box-shadow:none}
.t tbody th{cursor:pointer}
.t thead th.csel{color:var(--bg);background:var(--cselh);border-radius:5px 5px 0 0}
.empty{text-align:center;padding:22px 12px}
.empty .row{justify-content:center;margin-top:12px}
/* overlay screens */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.ovh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ovh h3{flex:1;margin:0;font-size:17px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:8px 0 4px}
input.f,select.f,textarea.f{width:100%;font:15px system-ui;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eg{border-collapse:collapse;font-variant-numeric:tabular-nums}
.eg th{font-size:11px;color:var(--mut);padding:2px 3px;white-space:nowrap;position:sticky;left:0;background:var(--bg);text-align:right}
.eg thead th{position:static}
.eg td{padding:1px}
.eg input{width:46px;font:14px system-ui;text-align:center;padding:6px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.eg input.flag{background:var(--flag);border-color:var(--flagb);border-width:2px}
.eg tr.sec th{text-align:left;color:var(--ink);font-weight:800;padding-top:10px}
.eg tr.hl th{color:var(--ink)}
.flagbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.flagbar .sp{flex:1;font-size:13px}
.prev{max-width:100%;max-height:52vh;display:block;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}.prog>div{height:100%;width:0;background:var(--ink);transition:width .2s}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:360px;width:100%;margin:0}
/* compare */
.zrow{display:grid;grid-template-columns:4fr 3fr;gap:8px}
.cw{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.cw svg{width:100%;height:auto;display:block;touch-action:pan-y}
.cw text{font:11px system-ui;fill:var(--mut)}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:2px}.tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.sw2{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.rbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px;border-top:1px solid var(--line)}
.rbar span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.frow{display:grid;grid-template-columns:18px 1fr auto;align-items:start;gap:4px 6px;padding:8px 0;border-top:1px solid var(--line)}
.frow .sw2{margin-top:8px}.frow .fn{grid-column:2/3;grid-row:1;padding-top:3px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .dblc{grid-column:3/4;grid-row:1/3;display:flex;flex-direction:column;gap:6px;align-self:center}
.frow .cw2{display:flex;align-items:center;gap:4px}.frow .fl{font-size:12px;font-weight:800;color:var(--mut);width:12px}
.frow .st{font:700 15px system-ui;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card)}
.frow select{width:80px;font:13px system-ui;padding:5px 4px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.frow .f3{grid-column:2/3;grid-row:2;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rt{display:inline-grid;grid-template-columns:auto auto auto;gap:1px 14px;text-align:right}.rt span:nth-child(-n+3){font-size:11px;color:var(--mut);font-weight:600}.rt span:nth-child(3n+1){text-align:left}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px}
.hide{display:none!important}
</style>
</head>

<main id="main"></main>

<input type="file" id="fileBak" accept=".json,application/json" class="hide">
